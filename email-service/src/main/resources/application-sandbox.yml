# No Docker/Postgres available here (e.g. this repo run standalone, or an agent working in a
# container without Docker access) -- H2 stands in for Postgres, same pattern as
# app/src/main/resources/application-sandbox.yml.
spring:
  datasource:
    url: jdbc:h2:file:./data/email_service;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
