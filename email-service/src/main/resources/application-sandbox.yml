# Real PostgreSQL, installed natively in this sandbox environment -- same pattern as
# app/src/main/resources/application-sandbox.yml (see specs/05-028-testes-exigem-docker-real/
# plan.md, "Contexto técnico"). Same database/roles as the `docker` profile
# (docker/postgres-email-service/init/01-roles.sql).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/email_service
    username: email_service_admin
    password: email_service_admin
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
