server:
  servlet:
    context-path: /api

spring:
  # Own schema, never public (spec 05-032): every service can share one PostgreSQL instance --
  # even one database -- without colliding. Set here, not in the URL, so it holds for every
  # profile, staging/production included, where the URL comes from outside. hikari.schema
  # becomes the connection's search_path (Flyway, Hibernate and Spring Session's own SQL).
  datasource:
    hikari:
      schema: email_service
  flyway:
    schemas: email_service
    table: email_service_schema_history
    locations: classpath:db/migration-email-service
  application:
    name: email-service
  # Spec 05-042: everything that changes per environment (docker, staging, production) comes from
  # config-server, which serves config-repo/email-service-<profile>.yml. Not optional: without
  # config-server this service does not start (fail-fast), after the client's retries -- a read,
  # so retrying is safe. The test suite replaces this file and switches the client off.
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  profiles:
    default: docker
  # Spec 05-048: the import job of the disposable-domain lists. Its tables come from Flyway
  # (V5), in schema email_service; nothing runs at startup -- an import starts on request or on
  # email.disposable-domains.import-cron.
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: email_service
  cloud:
    config:
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
    aws:
      # spring-cloud-aws-starter-ses (and -sqs, spec 05-031) autoconfigure their clients
      # unconditionally -- without a resolvable region those beans fail to construct at all,
      # breaking every context that boots this module, even one that never calls AWS (same
      # reasoning as app/src/main/resources/application.yml's region.static for SQS).
      region:
        static: ${AWS_REGION:us-east-1}

# Spec 05-031: SQS send queue POST /emails publishes to; email-lambda consumes it and sends via
# SES. Same queue (and default name) as app's email.queue-name -- created by
# docker/localstack/init/01-create-queue.sh in docker. One queue for every client of this service
# for now (plan.md, "Mesma fila ou fila nova").
email:
  queue-name: ${EMAIL_QUEUE_NAME:jogo-acoes-email-commands}
  # Spec 05-046: where email-lambda puts what it could not deliver, with the error type
  # (contracts/dlq-message.md); also the send queue's redrive target. Created by
  # docker/localstack/init/01-create-queue.sh in docker.
  dlq-name: ${EMAIL_DLQ_NAME:jogo-acoes-email-commands-dlq}
  # Spec 05-046: the background publisher. Retries wait initial-delay, doubling up to max-delay;
  # a send not delivered within give-up-after is FAILED.
  publisher:
    poll-interval: 1s
    batch-size: 20
    initial-delay: 1s
    max-delay: 5m
    give-up-after: 24h
  # Spec 05-046: a TEMPLATE_MISSING within this window of the last recreation does not recreate again.
  template:
    recreate-window: 1h
  disposable-domains:
    # Spec 05-048: limits of one list download. import-cron "-" switches the daily import off;
    # staging/production switch it on in config-repo.
    download-timeout: 30s
    max-size: 10MB
    import-cron: "-"

# Spec 05-048: permission catalog of this service's API keys (api-key 1.1.0), the same in every
# environment. A key issued without permissions (every key before 1.1.0, the jogo-acoes one
# included) gets the default: email:send only.
api-key:
  permissions:
    - name: email:send
      default: true
    - name: disposable-email:admin

logging:
  level:
    dev.leilaalgarve.jogoacoes.emailservice: DEBUG
