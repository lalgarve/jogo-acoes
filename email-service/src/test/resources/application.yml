server:
  servlet:
    context-path: /api

spring:
  # Same as src/main/resources/application.yml (spec 05-035) -- this file replaces that one, so
  # without repeating it no profile would be active unless SPRING_PROFILES_ACTIVE is set, a state
  # CI (which runs with `docker`) never tests.
  profiles:
    default: docker
  datasource:
    # Real PostgreSQL (docker-compose.yml's `db-email-service` service), not H2 -- see
    # specs/05-028-testes-exigem-docker-real/plan.md. Tests require
    # `docker compose up -d db-email-service` beforehand; there is no in-memory fallback.
    url: jdbc:postgresql://localhost:5433/email_service
    username: email_service_admin
    password: email_service_admin
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: email_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: email_service
  flyway:
    enabled: true
    # Same as src/main/resources/application.yml (spec 05-032) -- this file replaces that one.
    schemas: email_service
    table: email_service_schema_history
    locations: classpath:db/migration-email-service
  cloud:
    # Spec 05-042: the suite runs on this file's own values, not on config-server's -- unlike
    # src/main/resources/application.yml, there is no spring.config.import here.
    # ConfigServerClientIntegrationTest switches it back on.
    config:
      enabled: false
      # docker-compose.yml's test credentials for config-server, for the test that switches the
      # client on. Versioned on purpose, never a real secret.
      username: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD:config-docker-not-a-secret}
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: us-east-1
      ses:
        # Real LocalStack (docker-compose.yml's `localstack` service), not Testcontainers -- see
        # specs/05-028-testes-exigem-docker-real/plan.md. Tests require
        # `docker compose up -d localstack` beforehand.
        endpoint: http://localhost:4566
      sqs:
        # Same LocalStack. Spec 05-031: SendQueue (test support) creates the queue below itself.
        endpoint: http://localhost:4566

# Spec 05-031: a queue of this suite's own, not docker-compose's jogo-acoes-email-commands --
# LocalStack wires that one to the deployed email-lambda, which would consume each message before
# a scenario could read it back (see SendQueue).
email:
  queue-name: email-service-send-test
  # Spec 05-047: docker-compose.yml's test DNS server (docker/dns/), on the host port it publishes.
  # A short timeout: one scenario waits on a server that never answers (unavailable.test).
  domain-check:
    dns-servers: localhost:1053
    timeout: 1s

logging:
  level:
    dev.leilaalgarve.jogoacoes.emailservice: DEBUG

# Spec 05-030: HMAC pepper the api-key CLI hashed this environment's keys with (ApiKeyHasher reads
# API_KEY_HMAC_PEPPER). Test value, versioned on purpose -- matches the test key's dump
# (docker/postgres-email-service/test-data/README.md). An API_KEY_HMAC_PEPPER environment
# variable overrides it.
API_KEY_HMAC_PEPPER: jogo-acoes-test-pepper-not-a-secret
