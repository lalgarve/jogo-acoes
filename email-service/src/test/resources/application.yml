server:
  servlet:
    context-path: /api

spring:
  datasource:
    # Real PostgreSQL (docker-compose.yml's `db-email-service` service), not H2 -- see
    # specs/05-028-testes-exigem-docker-real/plan.md. Tests require
    # `docker compose up -d db-email-service` beforehand; there is no in-memory fallback.
    url: jdbc:postgresql://localhost:5433/email_service
    username: email_service_admin
    password: email_service_admin
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: email_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: email_service
  flyway:
    enabled: true
    # Same as src/main/resources/application.yml (spec 05-032) -- this file replaces that one.
    schemas: email_service
    table: email_service_schema_history
    locations: classpath:db/migration-email-service
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: us-east-1
      ses:
        # Real LocalStack (docker-compose.yml's `localstack` service), not Testcontainers -- see
        # specs/05-028-testes-exigem-docker-real/plan.md. Tests require
        # `docker compose up -d localstack` beforehand.
        endpoint: http://localhost:4566

logging:
  level:
    dev.leilaalgarve.jogoacoes.emailservice: DEBUG

# Spec 05-030: HMAC pepper the api-key CLI hashed this environment's keys with (ApiKeyHasher reads
# API_KEY_HMAC_PEPPER). Test value, versioned on purpose -- matches the test key's dump
# (docker/postgres-email-service/test-data/README.md). An API_KEY_HMAC_PEPPER environment
# variable overrides it.
API_KEY_HMAC_PEPPER: jogo-acoes-test-pepper-not-a-secret
