server:
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:h2:mem:email_service;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
  cloud:
    aws:
      # Replaced by @DynamicPropertySource once the Testcontainers LocalStack SES endpoint is
      # known (see EmailServiceLocalStackConfiguration) -- the static region fallback here only
      # matters for any context that boots without that configuration applied.
      region:
        static: us-east-1

logging:
  level:
    dev.leilaalgarve.jogoacoes.emailservice: DEBUG
