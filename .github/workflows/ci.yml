name: CI

on:
  # development receives the feature PRs while master stays frozen for the course evaluation; its
  # branch protection requires this workflow's `test` check.
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]
  # Lets CI be requested on demand against any branch -- e.g. a feature branch with no open PR
  # yet (GitHub web UI: Actions tab -> CI -> "Run workflow", pick the branch; or `gh workflow run
  # ci.yml --ref <branch>`) -- without widening the push: trigger above to run on every push to
  # every branch.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Java 21 is the project's supported baseline; LTS upgrades require an explicit
          # project decision, not an automatic CI update.
          java-version: '21'
          cache: maven

      # Real PostgreSQL (specs/05-028-testes-exigem-docker-real/plan.md: no H2 anywhere in this
      # project) -- one instance per service, app on 5432 and email-service on 5433. LocalStack
      # stands in for SQS and SES, so SqsEmailSender publishes to a real queue instead of just
      # compiling (docs/context/iteracao-4.md, "Produtor: EmailSender real") and email-service
      # registers templates in a real SES store. docker-compose.yml already defines all three
      # services with the init scripts the docker profile needs.
      # Spec 05-047: dns is the test DNS server email-service checks recipient domains against
      # (docker/dns/), also read directly by email-service's tests on localhost:1053.
      - name: Start Postgres, LocalStack and the test DNS
        run: docker compose up -d --wait db db-email-service localstack dns

      # Spec 05-042: config-server serves config-repo/ to email-service (read on startup), to each
      # suite's ConfigServerClientIntegrationTest and to app's ProductionProfileSuppressesLoggingAspectsTest.
      - name: Start config-server
        run: docker compose up -d --wait config-server

      # Spec 05-034: EmailServiceClientIntegrationTest calls the real email-service (its own
      # Postgres, SES on the LocalStack above). The test API key of client jogo-acoes has to be
      # restored before app's tests use it (docker/postgres-email-service/test-data/README.md).
      - name: Start email-service
        run: |
          docker compose up -d --wait db-email-service
          ./scripts/test-api-key.sh restore
          docker compose up -d --wait email-service
          # Again now that email-service's Flyway created client_sender: sets the sender of
          # client jogo-acoes (spec 05-031), which app's send test needs.
          ./scripts/test-api-key.sh restore

      - name: Run app tests with coverage (docker profile)
        env:
          SPRING_PROFILES_ACTIVE: docker
        run: mvn -B -pl app -am verify

      # The PR comment below only gives percentages; the HTML report shows line by line what is
      # uncovered. Uploaded even when the coverage gate failed the build, which is exactly when
      # it is needed (spec 05-036).
      - name: Upload app's JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-app
          path: app/target/site/jacoco/

      # Spec 05-046, T020: email-service's tests need neither app nor the email-service container,
      # and that container's background publisher would publish the PENDING sends the tests create
      # on its own queue. Everything app's tests used is taken down, volumes included, and only
      # what email-service's tests need comes up again, from scratch.
      - name: Take down the containers of app's tests
        if: ${{ !cancelled() }}
        run: docker compose down -v

      - name: Start PostgreSQL, LocalStack, the test DNS and config-server for email-service
        if: ${{ !cancelled() }}
        run: docker compose up -d --wait db-email-service localstack dns config-server

      # email-service depends on dev.leilaalgarve.apikey:api-key-validation, which is not on Maven
      # Central: the script installs it into ~/.m2 from the lalgarve/api-key release (a no-op when
      # the Maven cache already has it). Spec 05-030, T011.
      # Runs even if the app tests failed, so one red step doesn't hide the other service's result.
      - name: Install the api-key library
        if: ${{ !cancelled() }}
        run: ./scripts/install-api-key-lib.sh

      # A fresh db-email-service volume has no api_key schema; restoring the saved test key creates
      # the schema and the key every email-service test uses (spec 05-030, T011).
      - name: Restore email-service's test API key
        if: ${{ !cancelled() }}
        run: ./scripts/test-api-key.sh restore

      - name: Run email-service tests (docker profile)
        if: ${{ !cancelled() }}
        env:
          SPRING_PROFILES_ACTIVE: docker
        run: mvn -B -pl email-service -am verify

      # Spec 05-042: config-server's own tests read the real config-repo/; no infrastructure needed.
      - name: Run config-server tests
        if: ${{ !cancelled() }}
        run: mvn -B -pl config-server -am verify

      # JVM mode only -- the real deployable artifact is a GraalVM native image
      # (docs/context/iteracao-4.md), built manually/locally, never in CI: native compilation takes
      # several minutes and there's nowhere to deploy the result yet (blocked on AWS access).
      # Spec 05-053: no test starts a container -- the suite uses the LocalStack brought up above
      # (localhost:4566) with its own DLQ, senders and templates, so it runs before the containers
      # are taken down.
      - name: Build and test email-lambda (JVM mode)
        if: ${{ !cancelled() }}
        run: mvn -B -pl email-lambda -am test

      # Runs even if the coverage gate above failed the build, so the PR still shows the
      # actual percentage instead of just a red check with no explanation.
      - name: Comment coverage on the PR
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7
        with:
          paths: app/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 0
          title: 'Cobertura de testes (JaCoCo)'
          update-comment: true

      - name: Stop Postgres, LocalStack, config-server and email-service
        if: always()
        run: docker compose down -v
