# Which CDI bean handles the SQS-triggered invocation -- matches @Named("emailSend") on
# EmailSendHandler. There's only one handler in this module, but this is explicit rather
# than relying on Quarkus's single-handler auto-detection.
quarkus.lambda.handler=emailSend

# Placeholder for local/CI runs against LocalStack. Real finding (this test's first run
# against actual Docker in CI): LocalStack's SES emulation enforces sender verification just
# like real SES sandbox mode does -- EmailSendHandlerTest verifies this address against
# LocalStack itself before sending. The real deploy needs a verified SES identity too
# (docs/iteracao-4.md, decision 7) -- blocked on access to the project's AWS account, not
# something this repo can hardcode.
email.sender-address=no-reply@jogo-acoes.example

# AWS region and credentials are NOT set here for a real deploy -- the Lambda execution
# environment provides both (IAM role, AWS_REGION env var Lambda sets automatically). Tests
# don't need this either: Dev Services auto-configures the SES client against the LocalStack
# container it starts, only when Docker is available (docs/iteracao-4.md, decision 3).
