# Test-only: lets EmailSendHandlerTest see the tags of the SendTemplatedEmail requests the real SES
# client sends to LocalStack (see SentRequestRecorder).
quarkus.ses.interceptors=dev.leilaalgarve.jogoacoes.email.lambda.SentRequestRecorder

# Spec 05-046: this suite's own dead-letter queue, created by EmailSendHandlerTest itself in the
# shared LocalStack, so it never takes messages from the docker environment's DLQ.
email.dlq-name=email-lambda-test-dlq

# Spec 05-053: no test starts a container. Dev Services would start a LocalStack with
# Testcontainers; instead, the suite uses the LocalStack brought up before it (docker-compose.yml,
# on localhost:4566) -- without it, the tests fail with a connection error. Same region and test
# credentials as the deployed function (docker/localstack/init/03-deploy-email-lambda.sh).
quarkus.devservices.enabled=false
quarkus.ses.endpoint-override=http://localhost:4566
quarkus.ses.aws.region=us-east-1
quarkus.ses.aws.credentials.type=static
quarkus.ses.aws.credentials.static-provider.access-key-id=test
quarkus.ses.aws.credentials.static-provider.secret-access-key=test
quarkus.sqs.endpoint-override=http://localhost:4566
quarkus.sqs.aws.region=us-east-1
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=test
quarkus.sqs.aws.credentials.static-provider.secret-access-key=test
