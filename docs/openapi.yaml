openapi: 3.0.3
info:
  title: Jogo de Ações API
  version: "0.1.0"
  description: >
    API-first draft for Iteração 3 — routes derived from the four .feature files
    (create_competition, request_competition_entry, login, manage_competition_players).
    Written before any controller exists; adjust here first, then implement. Session-based
    auth (Spring Security, HttpSession/JSESSIONID cookie) established by consuming a login
    link — there is no password login.
servers:
  - url: /api

tags:
  - name: competitions
  - name: entry-requests
  - name: login
  - name: players
  - name: my-competitions

paths:
  /competitions:
    post:
      tags: [competitions]
      operationId: createCompetition
      summary: Create a competition (public or private)
      description: Requires an authenticated administrator (ROLE_ADMINISTRATOR).
      x-roles: [ADMINISTRATOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competition'
        '400':
          description: >
            Validation error — missing name, missing e-mail list (private), invalid e-mail,
            invalid start date, invalid duration, or invalid brokerage fee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in
        '403':
          description: Logged in, but not an administrator

  /competitions/public:
    get:
      tags: [competitions]
      operationId: listPublicCompetitions
      summary: List public competitions open to entry requests
      description: >
        Discovery — no session required. Only PUBLIC competitions with status OPEN; a
        competition never appears here once CLOSED, and PRIVATE competitions never appear
        here at all (spec 05-004, browse_public_competitions.feature). Replaces the
        `GET /competitions` placeholder that was in this contract but never implemented.
      x-roles: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetitionSummary'

  /competitions/mine:
    get:
      tags: [my-competitions]
      operationId: listMyCompetitions
      summary: List the caller's own competitions, grouped by relationship
      description: >
        Requires a logged-in session (any authenticated role) — spec 05-004,
        view_my_competitions.feature. Three fixed groups, always present even when empty.
      x-roles: [PLAYER, ADMINISTRATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCompetitions'
        '401': { description: Not logged in }

  /competitions/{competitionId}:
    get:
      tags: [my-competitions]
      operationId: getCompetitionDetail
      summary: Get a competition's basic information and the caller's access level to it
      description: >
        Requires a logged-in session (any authenticated role); the caller's relationship to
        the competition (participant, invited/requested-but-unconfirmed, administrator, or
        none) decides `accessLevel`, not the route itself — see spec 05-004's
        `CompetitionAccessResolver`. A player with no relationship to the competition gets
        `404`, not `403`, so as not to reveal it exists (same pattern as
        `requestOrConfirmEntry`).
      x-roles: [PLAYER, ADMINISTRATOR]
      parameters:
        - name: competitionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionDetail'
        '401': { description: Not logged in }
        '404': { description: "Competition not found, or the caller has no relationship to it" }

  /competitions/{competitionId}/invite-emails:
    post:
      tags: [competitions]
      operationId: decideInviteEmailTiming
      summary: Decide when to send invite e-mails for a newly created private competition
      description: >
        "the administrator decides to send the invite e-mails <timing>" — timing is `now`
        or `later`. `later` leaves the competition AWAITING_INVITES with no e-mails sent yet.
      x-roles: [ADMINISTRATOR]
      parameters:
        - name: competitionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timing]
              properties:
                timing:
                  type: string
                  enum: [now, later]
      responses:
        '204':
          description: No Content
        '401': { description: Not logged in }
        '403': { description: Not an administrator }
        '404': { description: Competition not found }

  /competitions/{competitionId}/entry-requests:
    post:
      tags: [entry-requests]
      operationId: requestOrConfirmEntry
      summary: Request entry into a public competition, or confirm entry if already logged in
      description: >
        Behavior depends on the caller's auth state (request_competition_entry.feature):
        unregistered/registered-but-logged-out players must supply `email` + `captchaToken`
        and get a registration/confirmation link by e-mail; a registered, logged-in player
        needs no body — entry is confirmed immediately from the session. A private
        competition without a prior invite always rejects (404, so as not to reveal it
        exists). Requesting again while a request is still pending resends the link instead
        of creating a duplicate. Also the mechanism behind "confirm entry" from the spec
        05-004 competition details screen (`canConfirmEntry`) — same endpoint, no new one.
      x-roles: []
      parameters:
        - name: competitionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryRequest'
      responses:
        '202':
          description: Accepted — confirmation/registration link sent (or resent) by e-mail
        '200':
          description: Logged-in player added directly to the competition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participation'
        '400':
          description: Invalid e-mail, or failed captcha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Private competition (no visible entry point), or competition not found

  /login-requests:
    post:
      tags: [login]
      operationId: requestLoginLink
      summary: Request a login link for an already-registered player or the administrator
      description: >
        Spec 05-005: `returnTo`, when present, is the page the caller was trying to reach
        before being asked to log in — consuming the resulting link redirects there instead
        of the role-based default. Must be a same-origin relative path (starts with a single
        `/`, never `//` right after); anything else is silently ignored, falling back to the
        default, since this endpoint requires no session and an unvalidated redirect target
        would be an open redirect.
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                returnTo:
                  type: string
                  description: Same-origin relative path to redirect to after login — see the operation description.
      responses:
        '202': { description: Accepted — link sent by e-mail if the address is known }

  /login-links/{token}:
    get:
      tags: [login]
      operationId: consumeLoginLink
      summary: Validate and consume a login link
      description: >
        Establishes the HTTP session (Spring Security Authentication in SecurityContext)
        on success. Covers login.feature's device rules: a link only logs in the device
        that first used it (used on a different device → error, unless already logged in
        on the current device, which just redirects); a fresh link for the same player
        invalidates any previous unused link; exceeding the configured device limit ends
        the oldest session instead of blocking the new login.
      x-roles: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >
            Valid link, already-registered player — session established, redirect target
            (a same-origin path) in the response body. See spec 05-005.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '202':
          description: Valid link, new player — registration (name) still required
        '400':
          description: Link invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Link already used to log in on a different device

  /login-links/{token}/registration:
    post:
      tags: [login]
      operationId: completeRegistration
      summary: Complete registration for a new player and confirm competition entry
      x-roles: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Registered, session established, added to the competition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400': { description: Link invalid or expired }

  /competitions/{competitionId}/players:
    get:
      tags: [players]
      operationId: listPlayers
      summary: List/filter a competition's players
      x-roles: [ADMINISTRATOR]
      parameters:
        - name: competitionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ParticipationStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participation'
        '401': { description: Not logged in }
        '403': { description: Not an administrator }
    post:
      tags: [players]
      operationId: invitePlayers
      summary: Invite new players to an existing private competition
      x-roles: [ADMINISTRATOR]
      parameters:
        - name: competitionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails:
                  type: array
                  items: { type: string, format: email }
      responses:
        '202': { description: "Accepted — players added with status e-mail not sent, then invited" }

  /competitions/{competitionId}/players/{participationId}:
    patch:
      tags: [players]
      operationId: updatePlayerEmail
      summary: Edit a player's e-mail
      x-roles: [ADMINISTRATOR]
      parameters:
        - name: competitionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: participationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlayerEmailRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participation'
        '400':
          description: Invalid e-mail format, or already used by another player in the competition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [players]
      operationId: removePlayer
      summary: Remove a player from the competition, or cancel a pending invite
      description: >
        Same underlying action for "remove that player" and "cancel the invite" — a
        pending invite is just a player whose status hasn't reached IN_COMPETITION yet.
      x-roles: [ADMINISTRATOR]
      parameters:
        - name: competitionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: participationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: No Content }

  /competitions/{competitionId}/players/{participationId}/invite-emails:
    post:
      tags: [players]
      operationId: resendPlayerInviteEmail
      summary: Send or resend the invite e-mail to one player
      x-roles: [ADMINISTRATOR]
      parameters:
        - name: competitionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: participationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '202': { description: Accepted }

  /competitions/{competitionId}/players/invite-emails:
    post:
      tags: [players]
      operationId: resendPlayerInviteEmails
      summary: Send or resend the invite e-mail to a group of players
      x-roles: [ADMINISTRATOR]
      parameters:
        - name: competitionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participationIds]
              properties:
                participationIds:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        '202': { description: Accepted }

components:
  schemas:
    CompetitionType:
      type: string
      enum: [PUBLIC, PRIVATE]
    CompetitionStatus:
      type: string
      enum: [AWAITING_INVITES, OPEN, CLOSED]
    ParticipationStatus:
      type: string
      enum: [EMAIL_NOT_SENT, EMAIL_SENT, LINK_CLICKED, IN_COMPETITION]

    Competition:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/CompetitionType' }
        startDate: { type: string, format: date }
        durationDays: { type: integer }
        recurring: { type: boolean }
        buyFee: { type: number, format: double }
        sellFee: { type: number, format: double }
        status: { $ref: '#/components/schemas/CompetitionStatus' }
        creatorId: { type: integer, format: int64 }

    CompetitionSummary:
      description: >
        Basic information only (spec 05-004) — used for discovery/listing, never the
        response of createCompetition (that stays `Competition`, which also carries
        `creatorId`/fees, administrator-only concerns).
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/CompetitionType' }
        status: { $ref: '#/components/schemas/CompetitionStatus' }
        startDate: { type: string, format: date }
        durationDays: { type: integer }

    AccessLevel:
      type: string
      enum: [READ, READ_WRITE]

    CompetitionDetail:
      allOf:
        - $ref: '#/components/schemas/CompetitionSummary'
        - type: object
          properties:
            recurring: { type: boolean }
            buyFee: { type: number, format: double }
            sellFee: { type: number, format: double }
            accessLevel: { $ref: '#/components/schemas/AccessLevel' }
            canConfirmEntry:
              type: boolean
              description: >
                True when the caller has a pending Participation (invited or requested, not
                yet confirmed) for this competition — the client should offer a "confirm
                entry" action that calls POST /competitions/{competitionId}/entry-requests
                with no body (the same endpoint requestOrConfirmEntry already exposes).

    MyCompetitions:
      description: Always all three groups, even when empty — never a flat list.
      type: object
      properties:
        participating:
          type: array
          items: { $ref: '#/components/schemas/CompetitionSummary' }
        pastParticipations:
          type: array
          items: { $ref: '#/components/schemas/CompetitionSummary' }
        pendingConfirmation:
          type: array
          items: { $ref: '#/components/schemas/CompetitionSummary' }

    CompetitionCreateRequest:
      type: object
      required: [name, type, startDate, durationDays, buyFee, sellFee]
      properties:
        name: { type: string }
        type: { $ref: '#/components/schemas/CompetitionType' }
        startDate: { type: string, format: date }
        durationDays: { type: integer }
        recurring: { type: boolean, default: false }
        buyFee: { type: number, format: double }
        sellFee: { type: number, format: double }
        emails:
          description: Required and non-empty when type is PRIVATE; ignored otherwise.
          type: array
          items: { type: string, format: email }

    Participation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        competitionId: { type: integer, format: int64 }
        userId: { type: integer, format: int64, nullable: true }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/ParticipationStatus' }
        requestType: { type: string, enum: [INVITE, REQUEST] }
        firstEmailSentDate: { type: string, format: date, nullable: true }
        joinedAt: { type: string, format: date, nullable: true }

    EntryRequest:
      type: object
      properties:
        email: { type: string, format: email }
        captchaToken: { type: string }

    UpdatePlayerEmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    LoginResult:
      description: >
        Spec 05-005: `redirectTo` is a full same-origin path, not a symbol — either the
        caller's own `returnTo` (see requestLoginLink) when it was honored, or a role-based
        default (`/admin`, `/competitions/mine`, or `/competitions/{id}`) otherwise. No
        separate `competitionId` field — the id is already embedded in the path when
        applicable.
      type: object
      properties:
        redirectTo:
          type: string

    Error:
      type: object
      properties:
        message: { type: string }
