openapi: 3.0.3
info:
  title: Serviço de E-mail
  version: "0.3.0"
  description: >
    Contrato API-first do Serviço de E-mail (Iteração 5). Escrito antes de qualquer
    controller — a implementação do módulo `email-service` segue este contrato.

    - Templates (specs/05-025-servico-email-templates): cadastro de templates, sincronizados
      com o Amazon SES (CreateTemplate/UpdateTemplate, validação real de sintaxe) e
      pré-visualizáveis (TestRenderTemplate) sem enviar e-mail nenhum.
    - Envio (specs/05-031-servico-email-envio): pedido de envio de um e-mail a partir de um
      template já cadastrado, com o remetente que operações configurou para o cliente; o serviço
      enfileira a mensagem na fila SQS de envio e a Lambda de e-mail entrega via SES
      (SendTemplatedEmail). O endpoint responde assim que a mensagem é enfileirada, não quando
      o e-mail é entregue.

    - Domínios de e-mail temporário (specs/05-048-importacao-listas-email-temporario): cadastro
      dos repositórios de listas e execução do lote (Spring Batch) que as importa; o envio
      recusa destinatários desses domínios.

    Autenticação por API-KEY validada pela biblioteca `api-key-validation`
    (specs/05-030-validacao-api-key-servico-email): formato, hash, expiração e revogação. O
    cliente dono dos templates e dos envios é aquele para o qual a chave foi emitida.

    Permissões (api-key 1.1.0, spec 05-048): cada chave tem permissões, e cada rota exige a sua.
    `email:send` (padrão das chaves emitidas antes da 1.1.0) libera `/templates` e `/emails`;
    `disposable-email:admin` libera `/disposable-domain-sources` e
    `/disposable-domain-imports`. Chave válida sem a permissão da rota recebe 403.
servers:
  - url: /api

tags:
  - name: templates
    description: Cadastro e pré-visualização de templates (spec 05-025)
  - name: emails
    description: Envio de e-mail a partir de um template cadastrado (spec 05-031)
  - name: disposable-domains
    description: >
      Repositórios das listas de domínios de e-mail temporário e execução do lote que as importa
      (spec 05-048). Exige a permissão disposable-email:admin.

security:
  - ApiKeyAuth: []

paths:
  /templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List the calling client's own templates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailTemplate'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/MissingEmailSendPermission'
    post:
      tags: [templates]
      operationId: createTemplate
      summary: Register a new template and sync it to SES (CreateTemplate)
      description: >
        Fails with 409 if a template with this name already exists for the calling client, or
        with 422 if SES rejects the template (CreateTemplate call) — e.g. invalid Handlebars
        syntax. The SES error message is passed through in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplateCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/MissingEmailSendPermission'
        '409':
          description: A template with this name already exists for this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: SES rejected the template -- message carries the reason SES returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /templates/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: >
          Template name, unique per client. Not the same as the namespaced name registered on
          SES (`<client>__<name>`) -- that namespacing is an internal implementation detail.
    get:
      tags: [templates]
      operationId: getTemplate
      summary: Get one of the calling client's own templates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/MissingEmailSendPermission'
        '404':
          description: No template with this name for this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [templates]
      operationId: updateTemplate
      summary: Update an existing template and re-sync it to SES (UpdateTemplate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplateUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/MissingEmailSendPermission'
        '404':
          description: No template with this name for this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: SES rejected the updated template -- message carries the reason SES returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /templates/{name}/preview:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [templates]
      operationId: previewTemplate
      summary: >
        Render a registered template with sample data via SES TestRenderTemplate -- never sends
        an email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplatePreviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePreviewResponse'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/MissingEmailSendPermission'
        '404':
          description: No template with this name for this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            SES could not render the template with the given variables (e.g. a variable
            referenced by the template is missing) -- message carries the reason SES returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /emails:
    post:
      tags: [emails]
      operationId: sendEmail
      summary: Queue one email built from one of the calling client's own templates
      description: >
        Looks up the template by name among the calling client's own templates and the
        sender address operations configured for the client, validates the request and
        publishes one message to the SQS send queue (senderAddress/templateName/templateData,
        rendered by SES at send time via
        SendTemplatedEmail). Responds 202 as soon as the message is queued -- delivery happens
        asynchronously in email-lambda, and a later delivery failure (bounce, complaint) is not
        reported back by this endpoint. The returned id travels with the message as its
        correlationId (and as the SES message tag `correlationId`).

        Before anything is recorded or queued, the recipient's domain must accept e-mail
        (spec 05-047): a domain on the service's whitelist passes at once; any other is looked up
        in DNS (MX, then A/AAAA when there is no MX) and, if approved, joins the whitelist. A
        domain that does not exist, has neither MX nor address, or declares a null MX is
        rejected with 422. When DNS does not answer, the send is accepted and the domain is not
        whitelisted.

        Before the whitelist and DNS (spec 05-048): a domain on the imported disposable e-mail
        lists, or any subdomain of one, is rejected with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        '202':
          description: Accepted -- the message is on the send queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailResponse'
        '400':
          description: >
            Malformed request -- e.g. missing templateName/recipientEmail, or recipientEmail
            not a syntactically valid address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/MissingEmailSendPermission'
        '404':
          description: No template with this name for this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            No sender address has been configured for the calling client yet (set by
            operations, not through this API) -- nothing was queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            The recipient's domain does not accept e-mail (spec 05-047), or it is (or is under) a
            disposable e-mail domain imported by the batch (spec 05-048) -- nothing was recorded
            or queued. The message says which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >
            The message could not be published to the send queue -- nothing was sent, the
            client may retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /disposable-domain-sources:
    get:
      tags: [disposable-domains]
      operationId: listDisposableDomainSources
      summary: List the repositories of disposable e-mail domain lists
      responses:
        '200':
          description: Every repository, with its last download, last database update and last import
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisposableDomainSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MissingDisposableEmailAdminPermission'
    post:
      tags: [disposable-domains]
      operationId: createDisposableDomainSource
      summary: Add a repository of a disposable e-mail domain list
      description: >
        The URL points at a plain-text file, one domain per line (the format of
        disposable-email-domains); blank lines and lines starting with # are ignored. Nothing is
        downloaded until an import runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisposableDomainSourceCreateRequest'
      responses:
        '201':
          description: Created -- not downloaded yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisposableDomainSource'
        '400':
          description: URL missing or not http/https, or description missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MissingDisposableEmailAdminPermission'
        '409':
          description: A repository with this URL already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /disposable-domain-imports:
    post:
      tags: [disposable-domains]
      operationId: startDisposableDomainImport
      summary: Run the import of one repository, or of all of them
      description: >
        Starts one execution of the batch per repository and answers at once; the imports run in
        the background. Each execution downloads the list, and when it changed since the last
        import that updated the database, adds the new domains and removes the ones that left
        it. A repository that fails changes nothing and does not stop the others.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisposableDomainImportRequest'
      responses:
        '202':
          description: Accepted -- one execution per repository
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisposableDomainImportStarted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MissingDisposableEmailAdminPermission'
        '404':
          description: No repository with this sourceId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An import of one of these repositories is already running -- nothing was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /disposable-domain-imports/{executionId}:
    parameters:
      - name: executionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [disposable-domains]
      operationId: getDisposableDomainImport
      summary: Status and counts of one import execution
      responses:
        '200':
          description: The execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisposableDomainImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MissingDisposableEmailAdminPermission'
        '404':
          description: No import execution with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  responses:
    Unauthorized:
      description: Missing or invalid X-API-Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MissingEmailSendPermission:
      description: >
        The key is valid but lacks the permission email:send (spec 05-048) -- message
        "Missing permission: email:send"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MissingDisposableEmailAdminPermission:
      description: >
        The key is valid but lacks the permission disposable-email:admin (spec 05-048) -- message
        "Missing permission: disposable-email:admin"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Chave emitida pela CLI do projeto lalgarve/api-key (spec 05-030). Qualquer chave
        ausente, malformada, desconhecida, expirada ou revogada recebe o mesmo 401, sem dizer
        o motivo. O cliente para o qual a chave foi emitida é o dono dos templates e dos envios.

  schemas:
    EmailTemplate:
      type: object
      properties:
        name: { type: string, description: "Nome do template, único por cliente" }
        subject: { type: string }
        body: { type: string, description: "Sintaxe Handlebars do SES" }
        variablesSchema:
          type: object
          nullable: true
          description: >
            JSON Schema das variáveis esperadas -- só armazenado nesta spec, não validado (ver
            spec.md, "Fora de escopo")
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EmailTemplateCreateRequest:
      type: object
      required: [name, subject, body]
      properties:
        name:
          type: string
          minLength: 1
          # At least one non-whitespace character anywhere (spec 05-045). Anchored and written
          # with [\s\S] so OpenAPI (unanchored ECMA-262) and Java's @Pattern (whole-string
          # match) read it the same way.
          pattern: '^[\s\S]*\S[\s\S]*$'
          description: Template name, unique per client. Must not be empty or whitespace only.
        subject: { type: string }
        body: { type: string }
        variablesSchema:
          type: object
          nullable: true

    EmailTemplateUpdateRequest:
      type: object
      required: [subject, body]
      properties:
        subject: { type: string }
        body: { type: string }
        variablesSchema:
          type: object
          nullable: true

    TemplatePreviewRequest:
      type: object
      required: [variables]
      properties:
        variables:
          type: object
          description: >
            Dados de exemplo para renderizar o template (equivalente ao TemplateData do
            SendTemplatedEmail)

    TemplatePreviewResponse:
      type: object
      properties:
        subject: { type: string, description: "Assunto já renderizado" }
        body: { type: string, description: "Corpo já renderizado" }

    Error:
      type: object
      properties:
        message: { type: string }

    SendEmailRequest:
      type: object
      required: [templateName, recipientEmail]
      properties:
        templateName:
          type: string
          description: >
            Nome do template, como cadastrado pelo próprio cliente (não o nome namespaced no
            SES)
        recipientEmail:
          type: string
          format: email
          description: Um único destinatário por pedido
        templateData:
          type: object
          additionalProperties: true
          description: >
            Variáveis para renderizar o template (TemplateData do SendTemplatedEmail). Ausente
            equivale a um objeto vazio.

    SendEmailResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
          description: >
            Identificador do envio -- vai na mensagem da fila como correlationId e como message
            tag do SES
        status:
          type: string
          enum: [QUEUED]
          description: Único valor nesta spec -- a mensagem foi publicada na fila de envio

    DisposableDomainSourceCreateRequest:
      type: object
      required: [url, description]
      properties:
        url:
          type: string
          maxLength: 2048
          pattern: '^https?://\S+$'
          description: Address of the list file, http or https
        description:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'

    DisposableDomainSource:
      type: object
      required: [id, url, description, domainCount]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        description: { type: string }
        lastDownloadedAt:
          type: string
          format: date-time
          description: Last successful download, even when the list had not changed; null before the first
        lastUpdatedAt:
          type: string
          format: date-time
          description: Last import that added or removed a domain of this repository; null before the first
        domainCount:
          type: integer
          format: int64
          description: Domains this repository has in the table now
        lastImport:
          description: Latest import of this repository; null before the first
          allOf:
            - $ref: '#/components/schemas/DisposableDomainImportSummary'

    DisposableDomainImportSummary:
      type: object
      required: [executionId, sourceId, status]
      properties:
        executionId: { type: integer, format: int64 }
        sourceId: { type: integer, format: int64 }
        status: { type: string, description: "STARTING, STARTED, COMPLETED, FAILED, STOPPED, ..." }
        endTime: { type: string, format: date-time }
        exitMessage: { type: string }

    DisposableDomainImportRequest:
      type: object
      properties:
        sourceId:
          type: integer
          format: int64
          description: Only this repository; absent means every repository

    DisposableDomainImportStarted:
      type: object
      required: [imports]
      properties:
        imports:
          type: array
          items:
            $ref: '#/components/schemas/DisposableDomainImportSummary'

    DisposableDomainImport:
      type: object
      required: [executionId, sourceId, status, read, skipped, added, removed]
      properties:
        executionId: { type: integer, format: int64 }
        sourceId: { type: integer, format: int64 }
        status: { type: string, description: "STARTING, STARTED, COMPLETED, FAILED, STOPPED, ..." }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        read: { type: integer, format: int64, description: Lines read from the list }
        skipped: { type: integer, format: int64, description: Lines that are not a domain (blank lines and comments are not counted) }
        added: { type: integer, format: int64, description: Domains this repository gained }
        removed: { type: integer, format: int64, description: Domains this repository lost }
        exitMessage:
          type: string
          description: Why it failed, or UNCHANGED when the list had not changed
