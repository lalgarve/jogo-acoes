server:
  servlet:
    context-path: /api

spring:
  profiles:
    # Same default as src/main/resources/application.yml (this file replaces that one): a
    # plain `mvn verify` runs against the docker profile, like CI. Set
    # SPRING_PROFILES_ACTIVE=sandbox to run without Docker.
    default: docker
  datasource:
    # Real PostgreSQL (docker-compose.yml's `db` service), not H2 -- see specs/05-028-testes-
    # exigem-docker-real/plan.md. Tests require `docker compose up -d db` beforehand; there is
    # no in-memory fallback.
    url: jdbc:postgresql://localhost:5432/jogo_acoes
    username: jogo_acoes_admin
    password: jogo_acoes_admin
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: jogo_acoes
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: jogo_acoes
  flyway:
    enabled: true
    # Same as src/main/resources/application.yml (spec 05-032) -- this file replaces that one.
    schemas: jogo_acoes
    table: jogo_acoes_schema_history
    locations: classpath:db/migration-jogo-acoes
  session:
    store-type: jdbc
    timeout: 30d
  cloud:
    aws:
      # See src/main/resources/application.yml -- this file replaces (not layers on top of)
      # that one during tests, so the same static-region workaround needs repeating here or
      # every @SpringBootTest/Cucumber context fails to boot (SqsAsyncClient autoconfiguration
      # is unconditional, unlike SqsEmailSender itself).
      region:
        static: us-east-1

altcha:
  secret: test-secret

login:
  max-devices-per-user: 3

# See src/main/resources/application.yml -- same replaces-not-layers reason as spring.cloud.aws
# above. Only actually needed when SPRING_PROFILES_ACTIVE=docker (application-docker.yml, which
# does layer on top of this file, is what flips email.sender to sqs and makes SqsEmailSender's
# @Value("${email.queue-name}") constructor param get resolved at all) -- defined here
# unconditionally anyway, so it's not missing the one time it matters.
email:
  queue-name: jogo-acoes-email-commands

# See src/main/resources/application.yml -- same replaces-not-layers reason as above; without
# this repeated here too, the three logging aspects (spec 05-011) never actually appear during
# tests even though the "real" application.yml already turns DEBUG on for dev.leilaalgarve.jogoacoes.
logging:
  level:
    dev.leilaalgarve.jogoacoes: DEBUG
