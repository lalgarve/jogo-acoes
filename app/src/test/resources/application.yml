server:
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:h2:mem:jogo_acoes;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
  session:
    store-type: jdbc
    timeout: 30d
  cloud:
    aws:
      # See src/main/resources/application.yml -- this file replaces (not layers on top of)
      # that one during tests, so the same static-region workaround needs repeating here or
      # every @SpringBootTest/Cucumber context fails to boot (SqsAsyncClient autoconfiguration
      # is unconditional, unlike SqsEmailSender itself).
      region:
        static: us-east-1

altcha:
  secret: test-secret

login:
  max-devices-per-user: 3

# See src/main/resources/application.yml -- same replaces-not-layers reason as spring.cloud.aws
# above. Only actually needed when SPRING_PROFILES_ACTIVE=docker (application-docker.yml, which
# does layer on top of this file, is what flips email.sender to sqs and makes SqsEmailSender's
# @Value("${email.queue-name}") constructor param get resolved at all) -- defined here
# unconditionally anyway, so it's not missing the one time it matters.
email:
  queue-name: jogo-acoes-email-commands
