# Same rule as staging: a separate team owns the schema and runs migrations by hand.
# The app only ever holds the limited jogo_acoes_app role and never runs Flyway itself. No
# default url/password: both must be provided by that team, never hardcoded in the repo.
# Schema and Flyway history names come from application.yml (spec 05-032): tables in schema
# `jogo_acoes` (never public), history in `jogo_acoes.jogo_acoes_schema_history`, scripts from
# db/migration-jogo-acoes. The team applying migrations by hand creates the schema and grants
# jogo_acoes_app USAGE on it plus SELECT/INSERT/UPDATE/DELETE on its tables and sequences.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:jogo_acoes_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false

# E-mail goes through email-service (spec 05-034): its URL (including /api) and this client's
# API key come from env EMAIL_SERVICE_BASE_URL and EMAIL_SERVICE_API_KEY, with no default.
email:
  sender: email-service
email-service:
  base-url: ${EMAIL_SERVICE_BASE_URL}

# Overrides application.yml's DEBUG back to root's own default (INFO) -- spec 05-011's three
# logging aspects log at DEBUG, so they simply stop appearing here, with no dedicated OFF level
# or in-code profile check needed.
logging:
  level:
    dev.leilaalgarve.jogoacoes: INFO
