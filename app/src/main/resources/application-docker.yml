# Real PostgreSQL in containers — local via docker-compose, or CI. The app owns the schema and
# runs Flyway itself (admin role). See docker/postgres/init/01-roles.sql. Disposable, not a
# long-lived shared database.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jogo_acoes}
    username: ${SPRING_DATASOURCE_USERNAME:jogo_acoes_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:jogo_acoes_admin}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

# email.sender comes from env EMAIL_SENDER here (application.yml): the app container in
# docker-compose.yml sends through email-service, while the Cucumber suites, run with this
# profile on the CI runner, keep the stub (spec 05-034).

# Session decision (2026-10-02): a plain `docker compose up`, with no admin-related
# configuration at all, should still bootstrap an administrator -- requiring ADMIN_EMAIL to be
# set by hand (AdministratorBootstrap's behavior without this) is only worth the friction in
# staging/production, where a typo would create a permanent, inaccessible administrator (the
# bootstrap never creates a second one). success+admin@simulator.amazonses.com is SES's own
# mailbox simulator (spec 05-016) -- always reachable in dev/test, so there's no such risk here.
# A real ADMIN_EMAIL env var (docker-compose.blackbox.yml already sets one) still wins over this
# default -- standard Spring Boot property precedence.
ADMIN_EMAIL: success+admin@simulator.amazonses.com
