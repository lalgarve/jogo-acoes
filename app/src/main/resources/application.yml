server:
  servlet:
    context-path: /api

spring:
  # Own schema, never public (spec 05-032): every service can share one PostgreSQL instance --
  # even one database -- without colliding. Set here, not in the URL, so it holds for every
  # profile, staging/production included, where the URL comes from outside. hikari.schema
  # becomes the connection's search_path (Flyway, Hibernate and Spring Session's own SQL).
  datasource:
    hikari:
      schema: jogo_acoes
  flyway:
    schemas: jogo_acoes
    table: jogo_acoes_schema_history
    locations: classpath:db/migration-jogo-acoes
  application:
    name: jogo-acoes
  # Spec 05-035: every place this project runs has Docker, so `docker` is the default; staging
  # and production always set SPRING_PROFILES_ACTIVE.
  profiles:
    default: docker
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: jogo_acoes
  session:
    store-type: jdbc
    timeout: 30d
  cloud:
    # Spec 05-034: email-service's Feign clients are the only ones in app, so "default" is
    # theirs. No automatic retry here: EmailServiceGateway retries idempotent calls only.
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

# Starting point, not a locked-in secret -- override via ALTCHA_SECRET in any environment
# where the default matters (i.e. anywhere reachable from outside docker).
altcha:
  secret: ${ALTCHA_SECRET:dev-only-altcha-secret-change-me}

# Starting point, not a locked-in product decision -- how many devices a player can stay
# logged into at once before the oldest session is ended.
login:
  max-devices-per-user: 3

# email.sender picks the EmailSender bean (dev.leilaalgarve.jogoacoes.email): "stub" (default)
# just records to sent_email; "email-service" sends through email-service's POST /emails (spec
# 05-034), which also needs email-service.base-url below. staging/production always use
# email-service; under docker it comes from env EMAIL_SENDER (the app container in
# docker-compose.yml sets it), so the Cucumber suites run with the stub.
email:
  sender: ${EMAIL_SENDER:stub}

# Spec 05-034: app calls email-service over HTTP. Everything under email-service.* (Feign client,
# gateway, template sync at startup) is active only where email-service.base-url is set -- env
# EMAIL_SERVICE_BASE_URL, e.g. the app container in docker-compose.yml. Unset by default so the
# Cucumber suites run without email-service. The key never goes into a versioned file other than
# the documented test key (spec 05-030).
email-service:
  api-key: ${EMAIL_SERVICE_API_KEY:}
# Names the generated TemplatesApiClient and EmailsApiClient read (openapi-generator's spring-cloud
# library); without them the url defaults to a relative "/api" and the context fails to start.
templates:
  name: email-service-templates
  url: ${email-service.base-url:}
emails:
  name: email-service-emails
  url: ${email-service.base-url:}

# Swagger UI (spec 05-009) against the static docs/openapi.yaml contract, copied to
# static/openapi.yaml at build time (app/pom.xml). springdoc.api-docs.enabled: false turns
# out to disable the whole SpringDocConfiguration bean the UI controller itself depends on
# (@ConditionalOnBean), not just the JSON endpoint -- confirmed by running it, not just
# reading the docs. packages-to-scan pointed at a nonexistent package gets the same effect
# (no annotation-scanned operations, so /v3/api-docs never becomes a second contract) without
# starving the UI of the bean it needs.
springdoc:
  packages-to-scan: dev.leilaalgarve.jogoacoes.__no_annotation_scanning__
  swagger-ui:
    # A leading-slash URL here is resolved by the browser from the server root, not from
    # server.servlet.context-path -- without the prefix the UI tries to fetch /openapi.yaml
    # instead of /api/openapi.yaml and 404s (confirmed by loading the page, not just reading
    # the property docs).
    url: ${server.servlet.context-path}/openapi.yaml

# DEBUG for the whole application package, not just common.logging (spec 05-011) -- this is
# what makes ControllerLoggingAspect/RepositoryLoggingAspect/EmailServiceLoggingAspect appear on the
# console (they all log at DEBUG), and establishes the same convention for any future log
# in the app. root stays at Spring Boot's own default (INFO). application-production.yml
# overrides this back to INFO to suppress the three aspects there.
logging:
  level:
    dev.leilaalgarve.jogoacoes: DEBUG
