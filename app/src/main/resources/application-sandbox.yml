# Real PostgreSQL, installed natively in this sandbox environment (not via Docker -- see
# specs/05-028-testes-exigem-docker-real/plan.md, "Contexto técnico"). Same database/roles as
# the `docker` profile (docker/postgres/init/01-roles.sql); only the process running Postgres
# differs (native vs. container).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jogo_acoes
    username: jogo_acoes_admin
    password: jogo_acoes_admin
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

# Session decision (2026-10-02) -- see application-docker.yml's ADMIN_EMAIL for the full
# reasoning: a default here too, so sandbox (no Docker needed) also bootstraps an administrator
# without requiring ADMIN_EMAIL to be set by hand. staging/production don't get this default.
ADMIN_EMAIL: success+admin@simulator.amazonses.com
