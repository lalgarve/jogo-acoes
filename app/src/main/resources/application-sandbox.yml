# No Docker/Postgres available here (e.g. this repo run standalone, or an agent working in
# a container without Docker access) — H2 stands in for Postgres, and Flyway runs the
# H2-flavored migrations in db/migration-h2 (not db/migration). If something behaves
# differently here than in docker/staging/production, that's the sandbox talking, not a bug
# in the real schema.
spring:
  datasource:
    url: jdbc:h2:file:./data/jogo_acoes;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration-h2

# Session decision (2026-10-02) -- see application-docker.yml's ADMIN_EMAIL for the full
# reasoning: a default here too, so sandbox (no Docker needed) also bootstraps an administrator
# without requiring ADMIN_EMAIL to be set by hand. staging/production don't get this default.
ADMIN_EMAIL: success+admin@simulator.amazonses.com
