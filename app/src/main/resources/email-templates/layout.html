<!--
  Shared frame of every e-mail the app sends through email-service (spec 05-034): header,
  content slot and footer. SES templates have no partials (unlike th:insert), so
  EmailTemplateSynchronizer pastes each template's content into the slot below before
  registering it. That's composing the template source, not rendering: the variables stay
  for SES to substitute at send time. Variables used here: link.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:24px 32px 8px 32px;">
                    <span style="font-size:14px; font-weight:bold; letter-spacing:0.5px; color:#2f6feb; text-transform:uppercase;">
                      Jogo de Ações
                    </span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
{{!-- content --}}
          <tr>
            <td>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:0 32px 32px 32px; border-top:1px solid #e4e7eb;">
                    <p style="margin:16px 0 0 0; font-size:12px; line-height:1.5; color:#7b8794;">
                      Se o botão acima não funcionar, copie e cole este link no seu navegador:<br/>
                      <span>{{link}}</span>
                    </p>
                    <p style="margin:16px 0 0 0; font-size:12px; line-height:1.5; color:#7b8794;">
                      Este link é válido por tempo limitado e só pode ser usado uma vez. Se você não
                      esperava este e-mail, pode ignorá-lo com segurança.
                    </p>
                    <p style="margin:16px 0 0 0; font-size:12px; line-height:1.5; color:#9aa5b1;">
                      Equipe Jogo de Ações
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
