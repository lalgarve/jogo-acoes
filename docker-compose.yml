services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jogo_acoes
      POSTGRES_USER: jogo_acoes_admin
      POSTGRES_PASSWORD: jogo_acoes_admin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jogo_acoes_admin -d jogo_acoes"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fake SQS for the docker profile (docs/context/iteracao-4.md, decisão 3 / "Produtor: EmailSender
  # real"): lets SqsEmailSender publish to a real queue in docker-compose/CI without needing
  # an actual AWS account. The init script creates the queue application-docker.yml expects.
  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      - db
      - localstack
    environment:
      # docker-compose only: the app owns the schema here, so it connects as the admin role
      # and runs Flyway itself. Staging/production use the limited jogo_acoes_app role
      # instead — see application-staging.yml / application-production.yml.
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jogo_acoes
      SPRING_DATASOURCE_USERNAME: jogo_acoes_admin
      SPRING_DATASOURCE_PASSWORD: jogo_acoes_admin
      # application-docker.yml defaults to localhost:4566 (right for CI, which runs mvn
      # directly on the runner, not inside this container) -- from inside the app container,
      # "localhost" is itself, so this overrides it to the compose network hostname.
      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://localstack:4566
    ports:
      - "8080:8080"

volumes:
  db_data:
