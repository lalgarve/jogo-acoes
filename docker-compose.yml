# Spec 05-052: in a Claude Code cloud session, scripts/cloud-up.sh runs config-server, email-service
# and app with `java -jar` and LocalStack with `docker run`, copying these services' variables. When
# a variable of localstack, config-server, email-service or app changes here, change it there too.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jogo_acoes
      POSTGRES_USER: jogo_acoes_admin
      POSTGRES_PASSWORD: jogo_acoes_admin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jogo_acoes_admin -d jogo_acoes"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Builds email-lambda's real deployable artifact (function.zip) directly against this repo's
  # source (bind-mounted, not a Docker image build) -- one-shot, exits 0, never stays up.
  # localstack (below) deploys that artifact as a real Lambda function and wires a real SQS
  # event source mapping to it (Issue #87 -- verified this genuinely works, no custom consumer
  # code needed; see specs/05-022-harness-teste-consumo-email/investigacao-issue-87.md), so it
  # has to exist before localstack's init scripts run.
  email-lambda-builder:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /build
    volumes:
      - .:/build
      - maven_cache:/root/.m2
    # This image's default user is root, so the reactor build leaves email-lambda/target owned
    # by root on the bind-mounted host repo. CI's own `mvn -pl email-lambda -am test` step runs
    # afterwards as the unprivileged runner user against that same path and fails with
    # "Operation not permitted" trying to overwrite those root-owned files -- a chmod alone
    # doesn't fix this, since Maven's resource copy also tries to carry over file attributes,
    # which requires owning the file (root still does). So: hand off only the one artifact that
    # needs to survive (function.zip, below) via a separate directory, and discard the rest of
    # this root-owned target/ before the container exits, instead of leaving it for the later
    # non-root build to collide with.
    #
    # Since target/ is discarded, Maven can never build incrementally here, so the build is
    # skipped entirely when dist/function.zip is newer than everything it's built from: the
    # parent POM and email-lambda's own POM and sources (it depends on no other reactor module).
    # Delete email-lambda/dist/ to force a rebuild. ($$ escapes Compose's own interpolation.)
    command:
      - sh
      - -c
      - |
        if [ -f email-lambda/dist/function.zip ] &&
           [ -z "$$(find pom.xml email-lambda/pom.xml email-lambda/src -newer email-lambda/dist/function.zip -print -quit)" ]; then
          echo 'email-lambda/dist/function.zip is up to date, skipping build'
          exit 0
        fi
        mvn -B -pl email-lambda -am package -DskipTests &&
          mkdir -p email-lambda/dist &&
          cp email-lambda/target/function.zip email-lambda/dist/ &&
          rm -rf email-lambda/target

  # Fake SQS+SES+Lambda for the docker profile (docs/context/iteracao-4.md, decisão 3 /
  # "Produtor: EmailSender real"): lets SqsEmailSender publish to a real queue in
  # docker-compose/CI without needing an actual AWS account. The init scripts create the queue
  # email-service's email.queue-name expects, verify the sender identity SES requires, and deploy
  # email-lambda as a real Lambda function wired to that queue via a real event source mapping
  # -- the same trigger mechanism production would use, just running here instead of on AWS.
  localstack:
    image: localstack/localstack:4
    depends_on:
      email-lambda-builder:
        condition: service_completed_successfully
    environment:
      # s3 isn't used directly, but /_aws/ses (reading sent messages for manual/blackbox
      # checks) fails with "Service 's3' is not enabled" against this LocalStack version
      # without it -- undocumented, found by hitting the endpoint. lambda is what actually
      # runs email-lambda's function.zip.
      SERVICES: sqs,ses,s3,lambda
      # Sender identity 02-verify-ses-sender.sh verifies -- the test client jogo-acoes's sender
      # address in email-service (spec 05-031, set by scripts/test-api-key.sh restore).
      EMAIL_SENDER_ADDRESS: no-reply@jogo-acoes.example
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init:/etc/localstack/init/ready.d:ro
      - ./email-lambda/dist:/tmp/email-lambda-target:ro
      # LocalStack's default ("docker") Lambda executor runs each function in a sibling
      # container, so it needs the host's Docker socket to create one.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spec 05-047: test DNS server (CoreDNS) email-service checks recipient domains against in the
  # docker environment -- fixed zones in docker/dns/, nothing forwarded to the internet. Port 1053
  # on the host for the email-service test suite, which runs outside Compose; inside Compose,
  # email-service reaches it as dns:53. The image has no shell, so no healthcheck: it answers as
  # soon as it is up.
  dns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./docker/dns:/etc/coredns:ro
    ports:
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:1053:53/tcp"

  # Web UI to inspect the docker-compose Postgres without a local psql/client install (spec
  # 05-013) -- used, among other things, by the caderno de testes' (spec 05-012) verification
  # SELECTs. Local-only: no volume/state of its own, no other profile runs it.
  adminer:
    image: adminer
    depends_on:
      - db
    ports:
      - "8081:8080"

  # Web UI over LocalStack's SES message store (Issue #88) -- same underlying data as
  # `GET /_aws/ses`, but rendered/browsable instead of raw JSON. Pure convenience, same
  # confinement as adminer above: never required for `mvn test`/CI, never in staging/production.
  # No published image, so building straight from a git build context: a fork of
  # veertech/localstack-aws-ses-email-viewer that also renders e-mails sent with
  # SendTemplatedEmail (spec 05-031) -- upstream crashes on them (Issue #156).
  ses-viewer:
    build: https://github.com/lalgarve/localstack-aws-ses-email-viewer.git
    depends_on:
      - localstack
    environment:
      LOCALSTACK_HOST: http://localstack:4566
    ports:
      - "3005:3005"

  # Web UI over the containers' stdout logs (spec 05-043) -- replaces `docker compose logs -f app`
  # in the caderno de testes: app and email-service merged in time order, with text search.
  # Reads the logs live from the Docker daemon and stores nothing (no volume, no database), so
  # `docker compose down` still discards them. Same confinement as adminer/ses-viewer above:
  # never required for `mvn test`/CI, never in staging/production. The socket is the same one
  # localstack already mounts, read-only here.
  log-viewer:
    image: amir20/dozzle:v8
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_started
      # Spec 05-034: app syncs its templates into email-service on startup and fails fast
      # otherwise, so email-service has to be accepting requests first.
      email-service:
        condition: service_healthy
      # Spec 05-042: app reads its configuration from config-server on startup and fails fast
      # otherwise.
      config-server:
        condition: service_healthy
    environment:
      # docker-compose only: the app owns the schema here, so it connects as the admin role
      # and runs Flyway itself. Staging/production use the limited jogo_acoes_app role
      # instead — see config-repo/jogo-acoes-staging.yml / jogo-acoes-production.yml.
      SPRING_PROFILES_ACTIVE: docker
      # Spec 05-042: where app reads config-repo/jogo-acoes-docker.yml from, with
      # config-server's test credentials (versioned on purpose, never a real secret).
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: config
      CONFIG_SERVER_PASSWORD: config-docker-not-a-secret
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jogo_acoes
      SPRING_DATASOURCE_USERNAME: jogo_acoes_admin
      SPRING_DATASOURCE_PASSWORD: jogo_acoes_admin
      # Spec 05-034: app calls email-service over HTTP (OpenFeign), registers its e-mail
      # templates there on startup and sends every e-mail through it -- app no longer talks to
      # the queue. The CI runner's Cucumber suites leave EMAIL_SENDER unset and use the stub.
      EMAIL_SERVICE_BASE_URL: http://email-service:8080/api
      EMAIL_SENDER: email-service
      # Test API key for calling email-service as client "jogo-acoes" (spec 05-030) -- docker
      # only, versioned on purpose, not a secret. Matches the row restored by
      # scripts/test-api-key.sh (docker/postgres-email-service/test-data/README.md): without that
      # restore, email-service answers 401 and app refuses to start.
      EMAIL_SERVICE_API_KEY: dak_IpfF8aaAizW6r1rSC59yi6BwMs4ox3GQDPiAWamRucU
    ports:
      - "8080:8080"

  # email-service's own Postgres (spec 05-025, plan.md "Banco de dados dedicado") -- a separate
  # container, not a second database in `db` above: real infrastructure isolation, same
  # reasoning already applied to deployo-api-key's own Postgres.
  db-email-service:
    image: postgres:16
    environment:
      POSTGRES_DB: email_service
      POSTGRES_USER: email_service_admin
      POSTGRES_PASSWORD: email_service_admin
    ports:
      - "5433:5432"
    volumes:
      - db_email_service_data:/var/lib/postgresql/data
      - ./docker/postgres-email-service/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_service_admin -d email_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serviço de E-mail (spec 05-025) -- cadastro de templates sincronizado com o SES e envio de
  # e-mail por template pela fila (spec 05-031). X-API-Key é
  # validada de verdade com a biblioteca api-key (spec 05-030): só chaves emitidas pela CLI no
  # schema api_key passam. A chave de teste (cliente jogo-acoes) vem do dump restaurado por
  # scripts/test-api-key.sh restore -- ver docker/postgres-email-service/test-data/README.md.
  email-service:
    build:
      context: .
      dockerfile: email-service/Dockerfile
    depends_on:
      db-email-service:
        condition: service_started
      localstack:
        condition: service_started
      # Spec 05-047: recipient domains are checked against this test DNS server.
      dns:
        condition: service_started
      # Spec 05-042: email-service reads its configuration from config-server on startup and
      # fails fast otherwise.
      config-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Spec 05-042: where email-service reads config-repo/email-service-docker.yml from, with
      # config-server's test credentials (versioned on purpose, never a real secret).
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: config
      CONFIG_SERVER_PASSWORD: config-docker-not-a-secret
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-email-service:5432/email_service
      SPRING_DATASOURCE_USERNAME: email_service_admin
      SPRING_DATASOURCE_PASSWORD: email_service_admin
      SPRING_CLOUD_AWS_SES_ENDPOINT: http://localstack:4566
      # Spec 05-031: POST /emails publishes to the send queue LocalStack's init scripts create and
      # wire to email-lambda (same queue as app's).
      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://localstack:4566
      EMAIL_QUEUE_NAME: jogo-acoes-email-commands
      # Test pepper the test key was hashed with (same value as config-repo/email-service-docker.yml); never a
      # real secret.
      API_KEY_HMAC_PEPPER: jogo-acoes-test-pepper-not-a-secret
    ports:
      - "8082:8080"
    # No actuator here: an open port means Tomcat is up, which Spring Boot starts only after the
    # context (Flyway, SES client) is ready. bash's /dev/tcp, since the JRE image has no curl.
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Spring Cloud Config Server (spec 05-042): serves app's and email-service's per-environment
  # configuration from config-repo/, mounted read-only -- what it serves is exactly the checkout,
  # branch included. Placeholders go out unresolved; each service resolves them itself. HTTP Basic
  # with test credentials (versioned on purpose, never a real secret). Small heap: no database, no
  # git clone, only a handful of YAML files.
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo/
      CONFIG_SERVER_USERNAME: config
      CONFIG_SERVER_PASSWORD: config-docker-not-a-secret
      JAVA_TOOL_OPTIONS: -Xmx128m
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    # Same check as email-service: an open port means the context is ready.
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8888"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  db_data:
  db_email_service_data:
  # Caches email-lambda-builder's dependency downloads across `docker compose up` runs --
  # without this, every run re-downloads the whole Maven reactor's dependencies from scratch.
  maven_cache:
