services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jogo_acoes
      POSTGRES_USER: jogo_acoes_admin
      POSTGRES_PASSWORD: jogo_acoes_admin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jogo_acoes_admin -d jogo_acoes"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Builds email-lambda's real deployable artifact (function.zip) directly against this repo's
  # source (bind-mounted, not a Docker image build) -- one-shot, exits 0, never stays up.
  # localstack (below) deploys that artifact as a real Lambda function and wires a real SQS
  # event source mapping to it (Issue #87 -- verified this genuinely works, no custom consumer
  # code needed; see specs/05-022-harness-teste-consumo-email/investigacao-issue-87.md), so it
  # has to exist before localstack's init scripts run.
  email-lambda-builder:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /build
    volumes:
      - .:/build
      - maven_cache:/root/.m2
    command: mvn -B -pl email-lambda -am package -DskipTests

  # Fake SQS+SES+Lambda for the docker profile (docs/context/iteracao-4.md, decisão 3 /
  # "Produtor: EmailSender real"): lets SqsEmailSender publish to a real queue in
  # docker-compose/CI without needing an actual AWS account. The init scripts create the queue
  # application-docker.yml expects, verify the sender identity SES requires, and deploy
  # email-lambda as a real Lambda function wired to that queue via a real event source mapping
  # -- the same trigger mechanism production would use, just running here instead of on AWS.
  localstack:
    image: localstack/localstack:4
    depends_on:
      email-lambda-builder:
        condition: service_completed_successfully
    environment:
      # s3 isn't used directly, but /_aws/ses (reading sent messages for manual/blackbox
      # checks) fails with "Service 's3' is not enabled" against this LocalStack version
      # without it -- undocumented, found by hitting the endpoint. lambda is what actually
      # runs email-lambda's function.zip.
      SERVICES: sqs,ses,s3,lambda
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init:/etc/localstack/init/ready.d:ro
      - ./email-lambda/target:/tmp/email-lambda-target:ro
      # LocalStack's default ("docker") Lambda executor runs each function in a sibling
      # container, so it needs the host's Docker socket to create one.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web UI to inspect the docker-compose Postgres without a local psql/client install (spec
  # 05-013) -- used, among other things, by the caderno de testes' (spec 05-012) verification
  # SELECTs. Local-only: no volume/state of its own, no other profile runs it.
  adminer:
    image: adminer
    depends_on:
      - db
    ports:
      - "8081:8080"

  # Web UI over LocalStack's SES message store (Issue #88) -- same underlying data as
  # `GET /_aws/ses`, but rendered/browsable instead of raw JSON. Pure convenience, same
  # confinement as adminer above: never required for `mvn test`/CI, never in staging/production.
  # No published image, so building straight from the upstream repo (git build context).
  ses-viewer:
    build: https://github.com/veertech/localstack-aws-ses-email-viewer.git
    depends_on:
      - localstack
    environment:
      LOCALSTACK_HOST: http://localstack:4566
    ports:
      - "3005:3005"

  app:
    build: .
    depends_on:
      - db
      - localstack
    environment:
      # docker-compose only: the app owns the schema here, so it connects as the admin role
      # and runs Flyway itself. Staging/production use the limited jogo_acoes_app role
      # instead — see application-staging.yml / application-production.yml.
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jogo_acoes
      SPRING_DATASOURCE_USERNAME: jogo_acoes_admin
      SPRING_DATASOURCE_PASSWORD: jogo_acoes_admin
      # application-docker.yml defaults to localhost:4566 (right for CI, which runs mvn
      # directly on the runner, not inside this container) -- from inside the app container,
      # "localhost" is itself, so this overrides it to the compose network hostname.
      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://localstack:4566
    ports:
      - "8080:8080"

volumes:
  db_data:
  # Caches email-lambda-builder's dependency downloads across `docker compose up` runs --
  # without this, every run re-downloads the whole Maven reactor's dependencies from scratch.
  maven_cache:
