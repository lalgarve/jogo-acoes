# Local development (docker-compose): the app owns the schema and runs Flyway itself,
# so it connects as the admin role. See docker/postgres/init/01-roles.sql.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jogo_acoes}
    username: ${SPRING_DATASOURCE_USERNAME:jogo_acoes_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:jogo_acoes_admin}
  flyway:
    enabled: true
