spring:
  datasource:
    url: jdbc:h2:mem:jogo_acoes;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
  session:
    store-type: jdbc
    timeout: 30d
